<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='8' width='26' height='16' rx='2' fill='%23efe3c8'/%3E%3Crect x='1' y='6' width='4' height='20' rx='2' fill='%238a3c2c'/%3E%3Crect x='27' y='6' width='4' height='20' rx='2' fill='%238a3c2c'/%3E%3Cpath d='M8 20l5-7 4 5 3-3 4 5z' fill='%235a6b7c'/%3E%3Ccircle cx='21' cy='12' r='2' fill='%23e8b04b'/%3E%3C/svg%3E" />
    <title>Emaki editor</title>
  </head>
  <body class="editor">
    <header class="topbar">
      <span class="brand">Emaki</span>
      <span class="story-title"></span>
      <nav class="actions" aria-label="Editor">
        <button type="button" id="run" title="Play the game from the line the cursor is on (Ctrl+Enter)">▶ Play from cursor <kbd>Ctrl+Enter</kbd></button>
        <button type="button" id="restart" title="Back to the title screen with a fresh game">Restart</button>
        <button type="button" id="format" title="Tidy the script's layout (Shift+Alt+F)">Format</button>
        <button type="button" id="problems" title="List problems (Ctrl+Shift+M)"></button>
      </nav>
      <span class="save-status" role="status" aria-live="polite">Saved</span>
    </header>

    <div class="conflict" role="alert" hidden>
      <p><b>story.vn was changed outside the editor</b> while you had unsaved edits. <span id="conflict-lines"></span></p>
      <button type="button" id="keep-mine">Keep the editor’s version</button>
      <button type="button" id="take-theirs">Load the file from disk</button>
    </div>

    <main class="workspace">
      <section class="pane script-pane" aria-label="Script">
        <h2 class="pane-head">story.vn</h2>
        <div class="cm-host"></div>
      </section>
      <div class="splitter" role="separator" aria-orientation="vertical" aria-label="Resize script and game" aria-valuemin="25" aria-valuemax="75" aria-valuenow="50" tabindex="0"></div>
      <div class="side">
        <section class="pane game-pane" aria-label="Game">
          <h2 class="pane-head">Game <span class="game-note" role="status"></span></h2>
          <div class="player-host"></div>
        </section>
        <section class="pane flow-pane" aria-label="Flowchart">
          <h2 class="pane-head">Flowchart <span class="hint">Click a scene to find it in the script · double-click to play it</span></h2>
          <div class="flow-host"></div>
        </section>
      </div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
