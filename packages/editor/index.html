<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='8' width='26' height='16' rx='2' fill='%23efe3c8'/%3E%3Crect x='1' y='6' width='4' height='20' rx='2' fill='%238a3c2c'/%3E%3Crect x='27' y='6' width='4' height='20' rx='2' fill='%238a3c2c'/%3E%3Cpath d='M8 20l5-7 4 5 3-3 4 5z' fill='%235a6b7c'/%3E%3Ccircle cx='21' cy='12' r='2' fill='%23e8b04b'/%3E%3C/svg%3E" />
    <title>Emaki editor</title>
  </head>
  <body class="editor" data-workspace="write">
    <header class="topbar">
      <span class="brand" aria-label="Emaki">絵</span>
      <span class="story-title"></span>
      <div class="workspaces seg" role="group" aria-label="Workspace">
        <button type="button" data-workspace="write" aria-pressed="true" title="The script and the game (Alt+1)">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 11l7-7 2 2-7 7H2zM8 5l2 2" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg>
          Write
        </button>
        <button type="button" data-workspace="stage" aria-pressed="false" title="The game large, to stage the scene (Alt+2)">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1.5 3h11v8h-11zM5 13h4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg>
          Stage
        </button>
        <button type="button" data-workspace="story" aria-pressed="false" title="The whole story and its routes (Alt+3)">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3.5a1.5 1.5 0 1 0 0 .01M11 3.5a1.5 1.5 0 1 0 0 .01M7 10.5a1.5 1.5 0 1 0 0 .01M4 4.5l2.5 5M10 4.5l-2.5 5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg>
          Story
        </button>
      </div>
      <span class="spacer"></span>
      <div class="transport">
        <button type="button" id="run" class="ibtn primary" title="Play from the line the cursor is on (Ctrl+Enter)" aria-label="Play from the line the cursor is on">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 2l9 5-9 5z" fill="currentColor" /></svg>
        </button>
        <button type="button" id="prev-line" class="ibtn" title="Previous line of the scene" aria-label="Previous line">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M12 2L5 7l7 5zM3 2v10" stroke="currentColor" stroke-width="1.6" fill="none" /></svg>
        </button>
        <button type="button" id="next-line" class="ibtn" title="Next line of the scene" aria-label="Next line">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l7 5-7 5zM11 2v10" stroke="currentColor" stroke-width="1.6" fill="none" /></svg>
        </button>
      </div>
      <div class="position" role="status" aria-label="Where every panel is"></div>
      <span class="spacer"></span>
      <nav class="actions" aria-label="Editor">
        <button type="button" id="restart" title="Back to the title screen with a fresh game">Restart</button>
        <button type="button" id="format" title="Tidy the script's layout (Shift+Alt+F)">Format</button>
        <button type="button" id="problems" title="List problems (Ctrl+Shift+M)"></button>
      </nav>
      <span class="save-status" role="status" aria-live="polite">Saved</span>
    </header>

    <div class="conflict" role="alert" hidden>
      <p><b><span id="conflict-file">story.vn</span> was changed outside the editor</b> while you had unsaved edits. <span id="conflict-lines"></span></p>
      <button type="button" id="keep-mine">Keep the editor’s version</button>
      <button type="button" id="take-theirs">Load the file from disk</button>
    </div>

    <main class="workspace">
      <div class="pane dock-host"></div>
      <section class="pane script-pane" aria-label="Script">
        <div class="pane-head file-head">
          <label for="file">File</label>
          <select id="file" title="Which file of the story to edit"></select>
          <button type="button" id="new-file" title="Add a file to the story (chapters, routes)">+ New file</button>
        </div>
        <div class="cm-host"></div>
      </section>
      <div class="splitter" role="separator" aria-orientation="vertical" aria-label="Resize the script and the game" tabindex="0"></div>
      <section class="pane game-pane" aria-label="Game">
        <h2 class="pane-head">Game <span class="game-note" role="status"></span></h2>
        <div class="stage-toolbar" role="toolbar" aria-label="Stage tools"></div>
        <div class="player-host"></div>
      </section>
      <section class="pane flow-pane" aria-label="Story">
        <div class="flow-host"></div>
      </section>
      <div class="pane inspector-host"></div>
      <div class="pane timeline-host"></div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
